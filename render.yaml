services:
  - type: web
    name: rechazos
    runtime: node
    plan: free
    buildCommand: npm --prefix frontend ci --include=dev && npm --prefix frontend run build && npm --prefix backend ci
    startCommand: node backend/scripts/migrate.js && node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: rechazos
      - key: DB_SSL
        value: "true"
      - key: DB_CA_CERT
        value: ""
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
